name: Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0a1b33&color_dots=#eef1f5,#bfdbfe,#60a5fa,#2563eb,#1e3a8a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e6ecf5&color_dots=#1a2335,#1e3a8a,#2563eb,#60a5fa,#bfdbfe

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
