.caret{animation:caret 1.1s steps(1,end) infinite}
@keyframes caret{50%{opacity:0}}
.bob{animation:bob 4.8s cubic-bezier(0.77,0,0.175,1) 2 alternate;transform-box:fill-box;transform-origin:center}
@keyframes bob{to{transform:translateY(-10px)}}
